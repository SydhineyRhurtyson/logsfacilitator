[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logsfacilitator"
version = "0.1.0"
description = "My tools for logging and performance measurement"
dependencies = [
    "functools",
    "time",
    "datetime",
    "os",
    "tracemalloc",
    "Pandas",
    "sympy"
]

[project.urls]
Homepage ="https://github.com/SydhineyRhurtyson/logsfacilitator"